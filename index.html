<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Notas - Limite y RLS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 30px auto; padding: 0 15px; }
    .box { background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    textarea { width: 100%; height: 70px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 10px; width: 100%; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .error { color: #dc3545; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Mis Notas</h2>

  <div class="box">
    <label><strong>Tipo de Plan:</strong></label><br>
    <input type="radio" id="planGratis" name="plan" value="gratis" checked onchange="actualizarPlan()">
    <label for="planGratis">Gratis (Máx 3)</label>
    <input type="radio" id="planPremium" name="plan" value="premium" onchange="actualizarPlan()">
    <label for="planPremium">Premium (Máx 5)</label>
  </div>

  <form id="notaForm">
    <textarea id="textoNota" placeholder="Escribí una nota de prueba..." required></textarea>
    <button type="submit">Guardar Nota</button>
  </form>

  <p id="mensajeLimite" class="error"></p>

  <h3>Notas Guardadas (<span id="contador">0</span>)</h3>
  <ul id="listaNotas"></ul>

  <script src="app.js"></script>
</body>
</html>
