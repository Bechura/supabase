<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Notas - Auth + Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 30px auto; padding: 0 15px; }
    .card { background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    textarea { width: 100%; height: 70px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; }
    .btn-main { background: #007bff; color: white; width: 100%; }
    .btn-google { background: #db4437; color: white; width: 100%; font-size: 15px; margin-bottom: 10px; }
    .btn-logout { background: #6c757d; color: white; font-size: 12px; }
    .hidden { display: none; }
    .error { color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Mis Notas (Protegido con Auth)</h2>

  <!-- Pantalla cuando NO hay sesión -->
  <div id="seccion-login" class="card">
    <p>Iniciá sesión para guardar y ver tus notas guardadas.</p>
    <button id="btnGoogle" class="btn-google" onclick="loginConGoogle()">Iniciar / Registrarse con Google</button>
  </div>

  <!-- Pantalla cuando SÍ hay sesión -->
  <div id="seccion-app" class="hidden">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <span id="userEmail" style="font-size: 13px; font-weight: bold;"></span>
      <button onclick="cerrarSesion()" class="btn-logout">Cerrar sesión</button>
    </div>

    <div class="card">
      <label><strong>Modo de Cuenta:</strong></label><br>
      <input type="radio" id="planGratis" name="plan" value="gratis" checked onchange="actualizarPlan()">
      <label for="planGratis">Gratis (Máx 3)</label>
      <input type="radio" id="planPremium" name="plan" value="premium" onchange="actualizarPlan()">
      <label for="planPremium">Premium (Máx 5)</label>
    </div>

    <form id="notaForm">
      <textarea id="textoNota" placeholder="Escribí una nota..." required></textarea>
      <button type="submit" class="btn-main">Guardar Nota</button>
    </form>

    <p id="mensajeLimite" class="error"></p>

    <h3>Notas Guardadas (<span id="contador">0</span>)</h3>
    <ul id="listaNotas"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
